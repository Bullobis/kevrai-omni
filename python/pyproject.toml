[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kevrai-studio-sidecar"
version = "1.0.0"
description = "Kevrai Studio — Python inference orchestration sidecar"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "huggingface-hub>=0.24",
  "PyYAML>=6.0",
  "jsonschema>=4.21",
  "websockets>=12.0",
  "xxhash>=3.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "black>=24.0",
  "jsonschema>=4.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["build", "dist", "node_modules"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (imports)
    "B",   # bugbear
    "UP",  # pyupgrade
    "S",   # bandit (security)
    "SIM", # simplify
]
ignore = [
    "S101",  # allow assert (we use pytest.raises/assert everywhere)
    "E501",  # line length handled by black/ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
no_implicit_optional = true
show_error_codes = true
exclude = ["build/", "dist/", "tests/"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.black]
line-length = 110
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.pytest_cache
  | build
  | dist
  | node_modules
)/
'''
