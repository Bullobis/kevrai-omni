[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Only the real app package. The tree also contains empty local artifacts
# (abc/, C:\Windows/) from path-safety tests; setuptools auto-discovery
# treats them as top-level packages and refuses to build.
include = ["app*"]

[project]
name = "kevrai-studio-sidecar"
version = "4.17.9"
description = "Kevrai Omni — Python inference orchestration sidecar"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "huggingface-hub>=0.24",
  "PyYAML>=6.0",
  "jsonschema>=4.21",
  "websockets>=12.0",
  "xxhash>=3.4",
  "pypdf>=6.16.0",
  "defusedxml==0.7.1",
  "mcp==1.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "black>=24.0",
  "jsonschema>=4.21",
]
# Media/format runtime deps (LTX MP4 export via imageio-ffmpeg, MNN/demucs
# numpy). Lazily imported at runtime, so optional: `pip install .[media]`.
media = [
  "numpy>=1.26",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
asyncio_mode = "auto"
markers = [
    "live: requires real network access (excluded by default)",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["build", "dist", "node_modules"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (imports)
    "B",   # bugbear
    "UP",  # pyupgrade
    "S",   # bandit (security)
    "SIM", # simplify
]
ignore = [
    "S101",  # allow assert (we use pytest.raises/assert everywhere)
    "E501",  # line length handled by black/ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
# The skill hub shells out to the system `git` for marketplace imports. The
# argv is a fixed list with no shell, and no user input is ever split into
# arguments, so S607 ("partial executable path") does not apply here.
"app/agent/skill_hub.py" = ["S607"]
# ``main.py`` must set HF_HOME / HF_HUB_* environment variables *before*
# importing ``huggingface_hub`` (it reads them at import time), so a block of
# imports deliberately sits below that setup. E402 is the point, not a slip.
"app/main.py" = ["E402"]
# ``engines.py`` / ``plugins.py`` invoke external tools (zstd, git, pip) with a
# fixed argv list, no shell, and a path resolved by ``_tool_path``. S603 flags
# any subprocess call; the argv-list form is the safe one.
"app/engines.py" = ["S603"]
"app/plugins.py" = ["S603"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
no_implicit_optional = true
show_error_codes = true
exclude = ["build/", "dist/", "tests/"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.black]
line-length = 110
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.pytest_cache
  | build
  | dist
  | node_modules
)/
'''
