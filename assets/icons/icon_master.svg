<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Kevrai Omni">
  <!--
    Kevrai Omni - icon master 3.6.1 (vector source of truth)

    3.6.1 重新设计：在原「六边形 + K」识别基础上做精致化 ——
      * 深藏蓝径向底（午夜蓝 → 深蓝黑），扁平中带微妙层次
      * 六边形与 K 使用 cyan→teal 柔和渐变（#22d3ee → #34d399），带克制辉光
      * 外围 4 个节点 + 细连线，暗示本地神经网络 / 多模态连接
    栅格化产物由本文件派生（rasterize.sh 需要 rsvg-convert；无头环境用 PIL
    从导出的 1024 PNG 重采样，流程等价）：
      assets/icons/icon-{16,24,32,48,64,128,256,512,1024}.png
      assets/icons/icon.ico
      assets/icons/icon-preview-on-white.png

    几何为手工矢量：六边形为尖顶（上下顶点），中心 (512,512)，外接半径 300。
  -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.82">
      <stop offset="0" stop-color="#0e2a52"/>
      <stop offset="0.55" stop-color="#071c3d"/>
      <stop offset="1" stop-color="#04102a"/>
    </radialGradient>
    <linearGradient id="accent" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#2dd4e6"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 外围节点 + 细连线（本地网络 / 多模态，克制点缀） -->
  <g stroke="#2fb6d4" stroke-width="3" opacity="0.55" fill="none">
    <path d="M330 330 L250 300 M694 330 L774 300 M300 690 L232 730 M724 690 L792 730"/>
  </g>
  <g fill="#38d6ef" opacity="0.9">
    <circle cx="250" cy="300" r="9"/>
    <circle cx="774" cy="300" r="9"/>
    <circle cx="232" cy="730" r="9"/>
    <circle cx="792" cy="730" r="9"/>
  </g>

  <!-- 主六边形 + K（渐变描边，带轻微辉光） -->
  <g filter="url(#glow)" fill="none" stroke="url(#accent)" stroke-width="42"
     stroke-linejoin="round" stroke-linecap="round">
    <!-- 尖顶六边形：中心 512,512，外接半径 300 -->
    <path d="M512 212 L772 362 L772 662 L512 812 L252 662 L252 362 Z"/>
    <!-- K 笔画：竖干 + 上斜 + 下斜 -->
    <path d="M410 360 L410 664"/>
    <path d="M410 512 L612 360"/>
    <path d="M410 512 L612 664"/>
  </g>
</svg>
