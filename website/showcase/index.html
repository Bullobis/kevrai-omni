<section><div class="wrap">
  <h1 style="font-size:32px;font-weight:700;letter-spacing:-.3px">界面预览</h1>
  <p class="sub">一个窗口装下所有本地 AI 能力。深色主题，原生前端，无臃肿框架。</p>

  <div style="display:flex;flex-direction:column;gap:32px">
    <figure style="margin:0">

    </figure>
    <figure style="margin:0">
      <img src="/shots/chat.png" alt="本地对话" style="width:100%;border:1px solid var(--line);border-radius:12px;display:block">
      <figcaption style="margin-top:10px;font-size:14px;color:var(--mut)"><b style="color:var(--fg)">本地对话</b> — llama.cpp 引擎，硬件信息与参数一目了然。</figcaption>
    </figure>
    <figure style="margin:0">
      <img src="/shots/image.png" alt="图像生成" style="width:100%;border:1px solid var(--line);border-radius:12px;display:block">
      <figcaption style="margin-top:10px;font-size:14px;color:var(--mut)"><b style="color:var(--fg)">图像生成</b> — 提示词、种子、步数、CFG，结果入画廊。</figcaption>
