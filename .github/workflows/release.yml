name: release

# 跨平台构建并发布到 GitHub Releases。
#   - 打 tag（v*）push 后自动运行；
#   - 也可在 Actions 页手动 workflow_dispatch，指定已有 tag 重新打包发布。
# Windows 的 NSIS 安装程序（.exe）由 windows-latest 自动构建，
# 弥补本地 Linux 无 Wine 无法交叉构建 Windows 安装包的缺口。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（手动运行时使用）"
        required: true
        default: "v4.17.5"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            target: "--linux AppImage deb"
            archflags: "--x64"
          - name: windows
            os: windows-latest
            target: "--win nsis zip"
            archflags: "--x64"
          - name: mac
            os: macos-latest
            target: "--mac dmg"
            archflags: "--x64 --arm64"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # Python sidecar 构建 —— 必须在 electron-builder 之前跑完，
      # 因为 electron-builder.yml 的 extraResources 硬依赖
      # python/dist/sidecar/ 目录存在，sidecar 会被 bundle 进每个
      # 平台的安装包/AppImage/便携版。
      # ----------------------------------------------------------------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('python/requirements.txt') }}

      - name: Install Python deps + PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt
          python -m pip install pyinstaller httpx  # httpx for health probe

      - name: Build PyInstaller sidecar (platform binary)
        shell: bash
        run: |
          cd python
          rm -rf build dist *.spec
          # --exclude-module: jedi/parso/IPython/matplotlib/pandas/scipy 均为
          # 传递依赖或未使用的重库（合计 ~140MB）。sidecar 运行时只直接
          # import numpy；torch/transformers 等引擎依赖由 _ensure_python_deps
          # 在运行时按需安装到用户目录，不进冻结包。剔除后 _internal
          # 335MB→157MB，三个平台安装包同步瘦身。
          pyinstaller run_sidecar.py --name sidecar --onedir \
            --distpath dist --workpath build --specpath dist \
            --collect-all uvicorn \
            --collect-all fastapi \
            --collect-all app \
            --collect-all python_multipart \
            --exclude-module jedi \
            --exclude-module parso \
            --exclude-module IPython \
            --exclude-module matplotlib \
            --exclude-module pandas \
            --exclude-module scipy
          echo "--- sidecar binary ---"
          ls -lh dist/sidecar/
          # Quick smoke — start for 3s then kill.
          # Log shows "kevrai-sidecar started" confirms uvicorn boots.
          timeout 6 dist/sidecar/sidecar 2>&1 | head -5 || true

      - name: Verify sidecar binary
        shell: bash
        run: |
          test -f python/dist/sidecar/sidecar \
            || { echo "::error::sidecar binary missing at python/dist/sidecar/sidecar"; exit 1; }
          echo "::notice::sidecar OK: $(ls -lh python/dist/sidecar/sidecar | awk '{print $5}')"

      # ----------------------------------------------------------------
      # Node + Electron —— 同原 workflow
      # ----------------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache electron / electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: eb-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: npm ci
        shell: bash
        run: npm ci --no-audit --no-fund
        env:
          ELECTRON_MIRROR: https://registry.npmmirror.com/-/binary/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://registry.npmmirror.com/-/binary/electron-builder-binaries/

      - name: Build with electron-builder
        shell: bash
        run: >-
          npx --yes electron-builder ${{ matrix.target }} ${{ matrix.archflags }}
          --publish never --config.npmRebuild=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify sidecar bundled in app
        shell: bash
        run: |
          # sidecar 应出现在 unpacked 目录的 resources/sidecar/ 下
          # —— 证明 electron-builder.yml 的 extraResources 正确命中
          if [ -d "build/output/linux-unpacked/resources/sidecar" ]; then
            RES="build/output/linux-unpacked/resources"
          elif [ -d "build/output/win-unpacked/resources/sidecar" ]; then
            RES="build/output/win-unpacked/resources"
          elif [ -d "build/output/mac/Kevrai Omni.app/Contents/Resources/sidecar" ]; then
            RES="build/output/mac/Kevrai Omni.app/Contents/Resources"
          else
            echo "::warning::could not locate bundled sidecar — skipping verify"
            exit 0
          fi
          test -f "$RES/sidecar/sidecar" \
            && echo "::notice::sidecar correctly bundled in $RES" \
            || { echo "::error::sidecar NOT bundled in $RES"; exit 1; }

      - name: List build output
        shell: bash
        run: ls -la build/output || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: |
            build/output/
            python/dist/sidecar/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-files
          echo "=== downloaded artifacts ==="
          find dist -maxdepth 2 -type d
          echo ""
          echo "=== collecting Kevrai-Omni-* products ==="
          # 品牌产物（安装包/AppImage/便携版/更新元数据）
          find dist -type f \
            \( -name "Kevrai-Omni-*" -o -name "latest*.yml" \) \
            -exec cp {} release-files/ \;
          echo ""
          echo "=== collecting sidecar binary (from linux build) ==="
          # linux job 产出的 PyInstaller sidecar ELF，单独上传方便不想装
          # Electron 的开发者直接用 sidecar 跑本地 API。
          SIDECAR_LINUX=$(find dist/dist-linux -path "*/python/dist/sidecar/sidecar" -type f 2>/dev/null | head -1)
          if [ -n "$SIDECAR_LINUX" ]; then
            cp "$SIDECAR_LINUX" release-files/sidecar
            echo "  copied linux sidecar: $SIDECAR_LINUX ($(du -h $SIDECAR_LINUX | cut -f1))"
          else
            echo "::warning::linux sidecar binary not found in dist/dist-linux"
          fi
          # 对安装包/归档生成 SHA256SUMS（不含 latest*.yml 与 blockmap）
          ( cd release-files \
            && sha256sum $(ls | grep -vE '^(latest|.*\.blockmap$)') > SHA256SUMS.txt ) || true
          echo ""
          echo "=== final release-files/ ==="
          ls -lh release-files/
          echo ""
          echo "=== sidecar smoke test ==="
          chmod +x release-files/sidecar 2>/dev/null || true
          timeout 6 release-files/sidecar 2>&1 | head -3 || true

      - name: Resolve tag
        id: rtag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rtag.outputs.tag }}
          name: Kevrai Omni ${{ steps.rtag.outputs.tag }}
          generate_release_notes: false
          body: |
            ## Kevrai Omni ${{ steps.rtag.outputs.tag }}

            ### 🎯 更新亮点

            - **跨平台构建**: Linux AppImage/deb、Windows NSIS 安装器+zip、macOS dmg（均由 GitHub Actions CI 原生构建）
            - **PyInstaller sidecar**: 已内置到所有平台安装包，首次启动无需单独安装 Python
            - **版本统一**: `package.json` + `python/app/__init__.py` 一致

            ### 📦 下载安装

            | 平台 | 文件 | 安装方式 |
            |------|------|----------|
            | Linux | `Kevrai-Omni-${{ steps.rtag.outputs.tag }}-x86_64.AppImage` | `chmod +x` 后直接运行 |
            | Linux | `Kevrai-Omni-${{ steps.rtag.outputs.tag }}-amd64.deb` | `sudo dpkg -i` |
            | Windows | `Kevrai-Omni-${{ steps.rtag.outputs.tag }}-x64.exe` | 双击 NSIS 安装器 |
            | Windows | `Kevrai-Omni-${{ steps.rtag.outputs.tag }}-x64.zip` | 解压便携版运行 `Kevrai Omni.exe` |
            | macOS | `Kevrai-Omni-${{ steps.rtag.outputs.tag }}-x64.dmg` / `arm64.dmg` | 拖入 Applications |

            ### 🏗️ 技术栈

            - Electron 33 / electron-builder 25 / Node 22
            - Python sidecar: FastAPI + uvicorn（PyInstaller frozen）
            - GitHub Actions: ubuntu-latest + windows-latest + macos-latest
          files: release-files/*
