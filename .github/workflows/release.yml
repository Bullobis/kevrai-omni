name: release

# 跨平台构建并发布到 GitHub Releases。
#   - 打 tag（v*）push 后自动运行；
#   - 也可在 Actions 页手动 workflow_dispatch，指定已有 tag 重新打包发布。
# Windows 的 NSIS 安装程序（.exe）由 windows-latest 自动构建，
# 弥补本地 Linux 无 Wine 无法交叉构建 Windows 安装包的缺口。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（手动运行时使用）"
        required: true
        default: "v4.18.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            # ubuntu-latest 已升到 26.04（glibc 2.38），打出的 sidecar 在
            # Ubuntu 22.04/24.04（glibc 2.35/2.39? 24.04=2.39）之外会报
            # "GLIBC_2.38 not found" 无法启动；22.04 构建的二进制兼容面更广。
            os: ubuntu-22.04
            target: "--linux AppImage deb"
            archflags: "--x64"
          - name: windows
            os: windows-latest
            target: "--win nsis zip"
            archflags: "--x64"
          - name: mac
            os: macos-latest
            target: "--mac dmg"
            archflags: "--x64 --arm64"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # Python sidecar 构建 —— 必须在 electron-builder 之前跑完，
      # 因为 electron-builder.yml 的 extraResources 硬依赖
      # python/dist/sidecar/ 目录存在，sidecar 会被 bundle 进每个
      # 平台的安装包/AppImage/便携版。
      # ----------------------------------------------------------------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('python/requirements.txt') }}

      - name: Install Python deps + PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt
          python -m pip install pyinstaller httpx  # httpx for health probe

      - name: Build PyInstaller sidecar (platform binary)
        shell: bash
        run: |
          cd python
          rm -rf build dist *.spec
          # --exclude-module: jedi/parso/IPython/matplotlib/pandas/scipy 均为
          # 传递依赖或未使用的重库（合计 ~140MB）。sidecar 运行时只直接
          # import numpy；torch/transformers 等引擎依赖由 _ensure_python_deps
          # 在运行时按需安装到用户目录，不进冻结包。剔除后 _internal
          # 335MB→157MB，三个平台安装包同步瘦身。
          export PYTHONPATH=.
          pyinstaller run_sidecar.py --name sidecar --onedir \
            --paths . --distpath dist --workpath build --specpath dist \
            --collect-all uvicorn \
            --collect-all fastapi \
            --collect-all app \
            --collect-all python_multipart \
            --collect-all jsonschema \
            --collect-all rfc3987_syntax \
            --exclude-module jedi \
            --exclude-module parso \
            --exclude-module IPython \
            --exclude-module matplotlib \
            --exclude-module pandas \
            --exclude-module scipy
          echo "--- sidecar binary ---"
          ls -lh dist/sidecar/
          # 安装包里 sidecar 是冻结二进制，sys.executable 指向 sidecar 自己，
          # `-m pip` 会以 rc=1 失败 → 用户永远装不上 Piper/Kokoro/ASR。
          # 这里额外编一个 pip 运行器，放进 sidecar 目录随包分发；
          # 运行时由 app/pip_exec.py 自动选用。
          export PYTHONPATH=.
          pyinstaller pip_runner.py --name pip-runner --onefile \
            --distpath dist/sidecar --workpath build/pip-runner --specpath dist \
            --collect-submodules pip \
            --collect-data pip \
            --exclude-module jedi \
            --exclude-module parso \
            --exclude-module IPython \
            --exclude-module matplotlib \
            --exclude-module pandas \
            --exclude-module scipy \
            --exclude-module torch \
            --exclude-module torchvision \
            --exclude-module uvloop
          echo "--- pip runner ---"
          ls -lh dist/sidecar/pip-runner* || true
          if [ -f dist/sidecar/pip-runner.exe ]; then
            PIP_RUNNER=dist/sidecar/pip-runner.exe
          else
            PIP_RUNNER=dist/sidecar/pip-runner
          fi
          "$PIP_RUNNER" --version
          # --version 不会触发 pip 的 distlib.scripts；真正安装一个轻量包才能
          # 覆盖 Windows 冻结版的 distlib finder 回归。
          "$PIP_RUNNER" install --no-input --dry-run --no-deps six
          # Quick smoke — start for 3s then kill.
          # Log shows "kevrai-sidecar started" confirms uvicorn boots.
          timeout 6 dist/sidecar/sidecar 2>&1 | head -5 || true

      - name: Verify sidecar binary
        shell: bash
        run: |
          if [ -f python/dist/sidecar/sidecar.exe ]; then
            SIDECAR_BIN=python/dist/sidecar/sidecar.exe
          elif [ -f python/dist/sidecar/sidecar ]; then
            SIDECAR_BIN=python/dist/sidecar/sidecar
          else
            echo "::error::sidecar binary missing at python/dist/sidecar/"; exit 1
          fi
          echo "::notice::sidecar OK: $(ls -lh "$SIDECAR_BIN" | awk '{print $5}')"
          # pip-runner 缺失时安装版无法安装任何引擎，必须在打包前拦住。
          if [ -f python/dist/sidecar/pip-runner.exe ]; then
            test -x python/dist/sidecar/pip-runner.exe
          else
            test -x python/dist/sidecar/pip-runner
          fi || { echo "::error::pip-runner missing — packaged engine install would be broken"; exit 1; }
          echo "::notice::pip-runner OK"

      # ----------------------------------------------------------------
      # Node + Electron —— 同原 workflow
      # ----------------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache electron / electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: eb-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: npm ci
        shell: bash
        run: npm ci --no-audit --no-fund
        env:
          ELECTRON_MIRROR: https://registry.npmmirror.com/-/binary/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://registry.npmmirror.com/-/binary/electron-builder-binaries/

      - name: Build with electron-builder
        shell: bash
        run: >-
          npx --yes electron-builder ${{ matrix.target }} ${{ matrix.archflags }}
          --publish never --config.npmRebuild=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify sidecar bundled in app
        shell: bash
        run: |
          # sidecar 应出现在 unpacked 目录的 resources/sidecar/ 下
          # —— 证明 electron-builder.yml 的 extraResources 正确命中
          if [ -d "build/output/linux-unpacked/resources/sidecar" ]; then
            RES="build/output/linux-unpacked/resources"
          elif [ -d "build/output/win-unpacked/resources/sidecar" ]; then
            RES="build/output/win-unpacked/resources"
          elif [ -d "build/output/mac/Kevrai Omni.app/Contents/Resources/sidecar" ]; then
            RES="build/output/mac/Kevrai Omni.app/Contents/Resources"
          else
            echo "::warning::could not locate bundled sidecar — skipping verify"
            exit 0
          fi
          test -f "$RES/sidecar/sidecar" \
            || test -f "$RES/sidecar/sidecar.exe" \
            && echo "::notice::sidecar correctly bundled in $RES" \
            || { echo "::error::sidecar NOT bundled in $RES"; exit 1; }

      - name: List build output
        shell: bash
        run: ls -la build/output || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: |
            build/output/
            python/dist/sidecar/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-files
          echo "=== downloaded artifacts ==="
          find dist -maxdepth 2 -type d
          echo ""
          echo "=== collecting Kevrai-Omni-* products ==="
          # 品牌产物（安装包/AppImage/便携版/更新元数据）
          find dist -type f \
            \( -name "Kevrai-Omni-*" -o -name "latest*.yml" \) \
            -exec cp {} release-files/ \;
          echo ""
          echo "=== collecting sidecar onedir (from linux build) ==="
          # PyInstaller --onedir is not a single executable: the binary needs
          # its sibling `_internal/` (libpython3.12.so.1.0, shared libs and
          # package data). Copying only `sidecar` produced a 17.6 MB asset that
          # could never start. Publish the whole directory as a tarball and
          # smoke-test the extracted tree, not the bare ELF.
          SIDECAR_LINUX=$(find dist/dist-linux -path "*/python/dist/sidecar/sidecar" -type f 2>/dev/null | head -1)
          if [ -n "$SIDECAR_LINUX" ]; then
            SIDECAR_DIR=$(dirname "$SIDECAR_LINUX")
            tar -C "$SIDECAR_DIR" -czf release-files/sidecar-linux-x64.tar.gz .
            echo "  packaged sidecar onedir: $SIDECAR_DIR ($(du -sh "$SIDECAR_DIR" | cut -f1))"
          else
            echo "::warning::linux sidecar onedir not found in dist/dist-linux"
          fi
          # 对安装包/归档生成 SHA256SUMS（不含 latest*.yml 与 blockmap）
          ( cd release-files \
            && sha256sum $(ls | grep -vE '^(latest|.*\.blockmap$)') > SHA256SUMS.txt ) || true
          echo ""
          echo "=== final release-files/ ==="
          ls -lh release-files/
          echo ""
          echo "=== sidecar smoke test (extracted onedir) ==="
          if [ -f release-files/sidecar-linux-x64.tar.gz ]; then
            SMOKE_DIR=$(mktemp -d)
            tar -xzf release-files/sidecar-linux-x64.tar.gz -C "$SMOKE_DIR"
            chmod +x "$SMOKE_DIR/sidecar"
            set +e
            timeout 8 "$SMOKE_DIR/sidecar" > "$SMOKE_DIR/smoke.log" 2>&1
            SMOKE_RC=$?
            set -e
            cat "$SMOKE_DIR/smoke.log" | head -20
            if ! grep -Eq 'kevrai-sidecar started|Uvicorn running|Application startup complete' "$SMOKE_DIR/smoke.log"; then
              echo "::error::sidecar tarball extracted but did not start (rc=$SMOKE_RC)"
              exit 1
            fi
            echo "::notice::sidecar tarball starts correctly"
            rm -rf "$SMOKE_DIR"
          else
            echo "::error::sidecar-linux-x64.tar.gz missing from release files"
            exit 1
          fi

      - name: Resolve tag
        id: rtag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          # electron-builder 的 artifactName 不含前导 v：v4.18.0 -> 4.18.0
          echo "ver=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Select release notes
        id: notes
        shell: bash
        run: |
          ver="${{ steps.rtag.outputs.ver }}"
          if [ -f "RELEASE_NOTES_${ver}.md" ]; then
            cp "RELEASE_NOTES_${ver}.md" release-files/RELEASE_NOTES.md
          else
            cat > release-files/RELEASE_NOTES.md <<'EOF'
          # Kevrai Omni ${ver}

          本次发布未找到 RELEASE_NOTES_${ver}.md，使用通用说明。
          EOF
          fi
          echo "path=release-files/RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rtag.outputs.tag }}
          name: Kevrai Omni ${{ steps.rtag.outputs.tag }}
          generate_release_notes: false
          body_path: ${{ steps.notes.outputs.path }}
          files: release-files/*
