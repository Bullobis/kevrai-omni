name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-progress runs when a new commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ------------------------------------------------------------------
  # 1. python — full pytest + coverage floor gate (>= 65%)
  # ------------------------------------------------------------------
  python:
    name: pytest (python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install Python deps (Tencent mirror)
        run: |
          python -m pip install -i https://mirrors.tencent.com/pypi/simple/ \
            --upgrade pip
          python -m pip install -i https://mirrors.tencent.com/pypi/simple/ \
            -r python/requirements.txt
          python -m pip install -i https://mirrors.tencent.com/pypi/simple/ \
            jsonschema pytest pytest-cov pytest-asyncio ruff mypy

      - name: Run pytest with coverage
        working-directory: python
        run: |
          # Record the exact dependency set.  A green local run against a red CI
          # run is almost always a version skew, and without this snapshot that
          # difference is invisible.
          python -m pip freeze > /tmp/pip-freeze.txt

          set +e
          python -m pytest -ra \
            --cov=app --cov-report=term-missing --cov-report=xml \
            tests/ 2>&1 | tee /tmp/pytest-out.txt
          rc=${PIPESTATUS[0]}
          set -e

          if [ "$rc" -ne 0 ]; then
            {
              echo "## pytest failed (exit ${rc})"
              echo
              echo "<details><summary>tail of pytest output</summary>"
              echo
              echo '```'
              tail -n 120 /tmp/pytest-out.txt
              echo '```'
              echo
              echo "</details>"
              echo
              echo "<details><summary>pip freeze</summary>"
              echo
              echo '```'
              cat /tmp/pip-freeze.txt
              echo '```'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"

            # Also surface the first hard failure as an annotation — annotations
            # are readable over the REST API even when log storage is not
            # reachable, which is the case for some restricted networks.
            first_fail="$(grep -m1 -E '^(FAILED|ERROR)' /tmp/pytest-out.txt || true)"
            if [ -n "$first_fail" ]; then
              echo "::error title=pytest failure::${first_fail}"
            else
              echo "::error title=pytest failure::pytest exited ${rc} — see the artifact 'pytest-output'"
            fi
          fi
          exit "$rc"

      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: |
            /tmp/pytest-out.txt
            /tmp/pip-freeze.txt
          if-no-files-found: ignore

      - name: Coverage gate (floor 65%, goal 80%)
        working-directory: python
        run: |
          # If the pytest step died before writing coverage data there is nothing
          # to gate on — say so plainly instead of reporting 0.0% and blaming the
          # floor, which sends you chasing the wrong problem.
          if [ ! -f .coverage ]; then
            echo "::error::no .coverage data — the pytest step did not complete; see its summary above"
            exit 1
          fi
          python -c "
          import sys, coverage
          cov = coverage.Coverage()
          cov.load()
          total = 0.0; covered = 0.0
          for fname in cov.get_data().measured_files():
              if not fname.startswith(\"$(pwd)\"): continue
              analysis = cov._analyze(fname)
              total += len(analysis.statements)
              covered += len([s for s in analysis.statements if s in analysis.executed])
          pct = (covered / total * 100.0) if total else 0.0
          print(f'Coverage: {pct:.1f}% ({covered}/{total})')

          # Floor is deliberately set just below the measured baseline (66.5%)
          # so the gate catches *regressions* without being permanently red.
          # Goal is 80%; see docs/COVERAGE.md for the gap and the priority
          # modules.  Raise this number as coverage actually improves — do not
          # raise it ahead of reality.
          FLOOR = 65.0
          GOAL  = 80.0

          if pct < FLOOR:
              print(f'::error::coverage {pct:.1f}% is below the {FLOOR:.0f}% floor')
              sys.exit(1)
          if pct < GOAL:
              print(f'::warning::coverage {pct:.1f}% is below the {GOAL:.0f}% goal')
          print('::notice::coverage gate passed')
          "

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: python/coverage.xml
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # 2. node — syntax-check every .js file (no npm install)
  # ------------------------------------------------------------------
  node:
    name: node --check (js syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: node --check on every .js file
        run: |
          set -e
          echo "## node --check results" >> $GITHUB_STEP_SUMMARY
          fail=0
          while IFS= read -r f; do
            if ! node --check "$f"; then
              echo "❌ $f: parse error"
              fail=1
            else
              echo "✓ $f"
            fi
          done < <(find . -type f -name '*.js' \
                    -not -path './node_modules/*' \
                    -not -path './build/*' \
                    -not -path './dist/*')
          if [ "$fail" -eq 1 ]; then
            echo "❌ one or more .js files failed to parse" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  # ------------------------------------------------------------------
  # 3. smoke — bash scripts/smoke.sh end-to-end
  # ------------------------------------------------------------------
  smoke:
    name: smoke (bash + pytest + node check + JSON)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run smoke.sh
        run: bash scripts/smoke.sh

  # ------------------------------------------------------------------
  # 4. lint — ruff + mypy on python/app
  # ------------------------------------------------------------------
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: |
          python -m pip install -i https://mirrors.tencent.com/pypi/simple/ \
            ruff mypy

      - name: ruff check python/
        working-directory: python
        run: ruff check .

      - name: mypy python/app/ --ignore-missing-imports
        working-directory: python
        run: |
          mypy app/ --ignore-missing-imports \
            --no-error-summary --no-incremental || true
          # Don't fail the build on mypy (best-effort), but emit a summary
          echo "::notice::mypy best-effort finished (non-blocking)"

  # ------------------------------------------------------------------
  # 5. summary — always reports what was tested
  # ------------------------------------------------------------------
  summary:
    name: ci summary
    runs-on: ubuntu-latest
    needs: [python, node, smoke, lint]
    if: always()
    steps:
      - name: Print job results
        run: |
          echo "## CI summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| python | ${{ needs.python.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| node | ${{ needs.node.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| smoke | ${{ needs.smoke.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.python.result }}" != "success" ] || \
             [ "${{ needs.node.result }}" != "success" ] || \
             [ "${{ needs.smoke.result }}" != "success" ]; then
            exit 1
          fi
