name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-progress runs when a new commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI jobs only read the tree and upload artifacts; no push, no release.
permissions:
  contents: read

jobs:

  # ------------------------------------------------------------------
  # 1. python — full pytest + coverage floor gate (>= 65%)
  # ------------------------------------------------------------------
  python:
    name: pytest (python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install Python deps (Tencent mirror)
        run: |
          python -m pip install -i https://mirrors.tencent.com/pypi/simple/ \
            --upgrade pip
          python -m pip install -i https://mirrors.tencent.com/pypi/simple/ \
            -r python/requirements.txt
          python -m pip install -i https://mirrors.tencent.com/pypi/simple/ \
            jsonschema pytest pytest-cov pytest-asyncio ruff mypy

      - name: Run pytest with coverage
        working-directory: python
        run: |
          # Record the exact dependency set.  A green local run against a red CI
          # run is almost always a version skew, and without this snapshot that
          # difference is invisible.
          python -m pip freeze > /tmp/pip-freeze.txt

          set +e
          python -m pytest -ra \
            --cov=app --cov-report=term-missing --cov-report=xml \
            tests/ 2>&1 | tee /tmp/pytest-out.txt
          rc=${PIPESTATUS[0]}
          set -e

          if [ "$rc" -ne 0 ]; then
            {
              echo "## pytest failed (exit ${rc})"
              echo
              echo "<details><summary>tail of pytest output</summary>"
              echo
              echo '```'
              tail -n 120 /tmp/pytest-out.txt
              echo '```'
              echo
              echo "</details>"
              echo
              echo "<details><summary>pip freeze</summary>"
              echo
              echo '```'
              cat /tmp/pip-freeze.txt
              echo '```'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"

            # Also surface the first hard failure as an annotation — annotations
            # are readable over the REST API even when log storage is not
            # reachable, which is the case for some restricted networks.
            first_fail="$(grep -m1 -E '^(FAILED|ERROR)' /tmp/pytest-out.txt || true)"
            if [ -n "$first_fail" ]; then
              echo "::error title=pytest failure::${first_fail}"
            else
              echo "::error title=pytest failure::pytest exited ${rc} — see the artifact 'pytest-output'"
            fi
          fi
          exit "$rc"

      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: |
            /tmp/pytest-out.txt
            /tmp/pip-freeze.txt
          if-no-files-found: ignore

      - name: Coverage gate (floor 65%, goal 80%)
        working-directory: python
        run: |
          # If the pytest step died before writing coverage data there is nothing
          # to gate on — say so plainly instead of reporting 0.0% and blaming the
          # floor, which sends you chasing the wrong problem.
          if [ ! -f .coverage ]; then
            echo "::error::no .coverage data — the pytest step did not complete; see its summary above"
            exit 1
          fi
          # A stale or truncated .coverage satisfies `-f` but measures nothing.
          # Distinguish "covered badly" from "never measured" so the failure
          # points at the real problem.
          if [ ! -s .coverage ]; then
            echo "::error::.coverage exists but is empty — pytest did not record any data"
            exit 1
          fi
          python -c "
          import sys, coverage
          cov = coverage.Coverage()
          cov.load()
          total = 0.0; covered = 0.0
          for fname in cov.get_data().measured_files():
              if not fname.startswith(\"$(pwd)\"): continue
              analysis = cov._analyze(fname)
              total += len(analysis.statements)
              covered += len([s for s in analysis.statements if s in analysis.executed])
          if total == 0:
              print('::error::coverage data is present but measured 0 statements — pytest collected nothing; not a floor failure')
              sys.exit(1)
          pct = (covered / total * 100.0) if total else 0.0
          print(f'Coverage: {pct:.1f}% ({covered}/{total})')

          # Floor is deliberately set just below the measured baseline (69.6%)
          # so the gate catches *regressions* without being permanently red.
          # Goal is 80%; see docs/COVERAGE.md for the gap and the priority
          # modules.  Raise this number as coverage actually improves — do not
          # raise it ahead of reality.
          FLOOR = 68.0
          GOAL  = 80.0

          if pct < FLOOR:
              print(f'::error::coverage {pct:.1f}% is below the {FLOOR:.0f}% floor')
              sys.exit(1)
          if pct < GOAL:
              print(f'::warning::coverage {pct:.1f}% is below the {GOAL:.0f}% goal')
          print('::notice::coverage gate passed')
          "

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: python/coverage.xml
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # 2. node — syntax-check every .js file (no npm install)
  # ------------------------------------------------------------------
  node:
    name: node --check (js syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: node --check on every .js file
        run: |
          set -e
          echo "## node --check results" >> $GITHUB_STEP_SUMMARY
          fail=0
          while IFS= read -r f; do
            if ! node --check "$f"; then
              echo "❌ $f: parse error"
              fail=1
            else
              echo "✓ $f"
            fi
          done < <(find . -type f -name '*.js' \
                    -not -path './node_modules/*' \
                    -not -path './build/*' \
                    -not -path './dist/*')
          if [ "$fail" -eq 1 ]; then
            echo "❌ one or more .js files failed to parse" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  # ------------------------------------------------------------------
  # 3. smoke — bash scripts/smoke.sh end-to-end
  # ------------------------------------------------------------------
  smoke:
    name: smoke (bash + pytest + node check + JSON)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run smoke.sh
        run: bash scripts/smoke.sh

  # ------------------------------------------------------------------
  # 4. lint — ruff + mypy on python/app
  # ------------------------------------------------------------------
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: |
          python -m pip install -i https://mirrors.tencent.com/pypi/simple/ \
            ruff mypy

      - name: ruff check python/
        working-directory: python
        run: ruff check .

      - name: mypy python/app/ --ignore-missing-imports
        working-directory: python
        run: |
          # Hard gate: the backlog is now zero, so MAX_ERRORS is 0 and any new
          # type error fails the build. It was previously 29 (the size of the
          # pre-existing backlog, paid down in v2.9.0).
          #
          # Never raise MAX_ERRORS to make CI green — fix the type error, or
          # suppress it locally at the site with a narrowly-scoped
          # `# type: ignore[<code>]` and a comment explaining why.
          #
          # IMPORTANT — mypy's own exit status is load-bearing here. The naive
          # version of this gate (the one that shipped before v2.9.0) was:
          #
          #     mypy app/ ... > out 2>&1 || true
          #     COUNT=$(grep -c "error:" out || true)
          #     [ "$COUNT" -gt 29 ] && exit 1
          #
          # That silently passes whenever mypy never gets far enough to emit
          # per-line diagnostics: a missing dependency, a bad config, a wrong
          # path, or an interpreter mismatch makes mypy abort with a *usage*
          # message that contains no `error:` line, so COUNT=0 and the gate
          # reports "did not regress (0 <= 29)". Verified reproduction:
          #
          #     $ mypy onlyclean.py --no-error-summary   # file absent
          #     mypy: can't read file 'onlyclean.py': No such file or directory
          #     $ grep -c "error:" out
          #     0            -> old gate: PASS
          #
          # So capture the real exit code first. mypy exits 0 when clean, 1 when
          # it found type errors, and >= 2 when it could not run at all (fatal).
          # Treat >= 2 as a hard failure rather than as "zero errors".
          MAX_ERRORS=0
          set +e
          mypy app/ --ignore-missing-imports \
            --no-error-summary --no-incremental > /tmp/mypy.out 2>&1
          MYPY_RC=$?
          set -e
          echo "mypy exit code: ${MYPY_RC}"
          tail -20 /tmp/mypy.out

          if [ "${MYPY_RC}" -ge 2 ]; then
            echo "::error::mypy could not run (exit ${MYPY_RC}) — refusing to report '0 errors'. See output above."
            exit 1
          fi

          # `grep -c` prints 0 and exits 1 on no matches; the tool runs with
          # `set -e` in the runner, so normalise it explicitly.
          COUNT=$(grep -c "error:" /tmp/mypy.out) || COUNT=0
          echo "mypy errors: ${COUNT} (allowed: ${MAX_ERRORS})"

          if [ "${COUNT}" -gt "${MAX_ERRORS}" ]; then
            echo "::error::mypy errors grew from ${MAX_ERRORS} to ${COUNT}"
            exit 1
          fi
          echo "::notice::mypy error count did not regress (${COUNT} <= ${MAX_ERRORS})"

  # ------------------------------------------------------------------
  # 5. build — best-effort packaging smoke (NOT a required gate)
  #    Proves `npm ci` installs and electron-builder.yml actually produces a
  #    coherent unpacked app.  continue-on-error so a packaging-env hiccup
  #    never blocks PRs; its job is to catch files/extraResources regressions
  #    (e.g. python/tests leaking back into the install) before release day.
  # ------------------------------------------------------------------
  build:
    name: electron-builder --dir (packaging smoke, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache electron / electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-bins-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: pip install python sidecar deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt

      - name: npm audit (best-effort, non-blocking)
        run: npm audit --audit-level=high || echo "::warning::npm audit reported advisories (non-blocking)"

      - name: pip audit (best-effort, non-blocking)
        run: |
          python -m pip install pip-audit || echo "::warning::could not install pip-audit"
          python -m pip_audit -r python/requirements.txt || echo "::warning::pip-audit reported advisories (non-blocking)"

      - name: electron-builder --linux --dir (unpacked only, no publish)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --yes electron-builder --linux --dir --publish never --config.npmRebuild=false

      - name: Verify packaged structure
        run: |
          set -e
          RES="build/output/linux-unpacked/resources"
          echo "## packaged resources" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -la "$RES" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # catalog must be bundled
          test -d "$RES/catalog" || { echo "::error::catalog missing from resources"; exit 1; }
          # python sidecar app sources must be bundled
          test -d "$RES/python/app" || { echo "::error::python/app missing from resources"; exit 1; }
          # but the test suite MUST be excluded (regression guard for the
          # extraResources filter in electron-builder.yml)
          if [ -d "$RES/python/tests" ]; then
            echo "::error::python/tests was bundled into the installer — extraResources filter regressed"
            exit 1
          fi
          echo "::notice::packaged structure OK (python/tests correctly excluded)"

  # ------------------------------------------------------------------
  # 6. pre-commit — run the project's pre-commit hooks on every file.
  #    Advisory (continue-on-error): the pinned hook revs have drifted from the
  #    authoritative `lint` job (ruff/mypy), and mypy under pre-commit runs
  #    without the project deps, so this surfaces whitespace / yaml / json /
  #    shell / format issues early without turning PRs red.  Fix the reported
  #    nits as you touch files; promote this to a hard gate once the hook revs
  #    match the lint job and the isolated-env debt is paid down.
  # ------------------------------------------------------------------
  pre-commit:
    name: pre-commit (all files, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: pre-commit run --all-files
        run: pre-commit run --all-files

  # ------------------------------------------------------------------
  # 7. summary — always reports what was tested
  # ------------------------------------------------------------------
  summary:
    name: ci summary
    runs-on: ubuntu-latest
    needs: [python, node, smoke, lint]
    if: always()
    steps:
      - name: Print job results
        run: |
          echo "## CI summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| python | ${{ needs.python.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| node | ${{ needs.node.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| smoke | ${{ needs.smoke.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.python.result }}" != "success" ] || \
             [ "${{ needs.node.result }}" != "success" ] || \
             [ "${{ needs.smoke.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::error::one or more required jobs failed"
            exit 1
          fi
