name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-progress runs when a new commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ------------------------------------------------------------------
  # 1. python — full pytest + coverage gate (>= 80%)
  # ------------------------------------------------------------------
  python:
    name: pytest (python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install Python deps (Tencent mirror)
        run: |
          python -m pip install -i https://mirrors.tencent.com/pypi/simple/ \
            --upgrade pip
          python -m pip install -i https://mirrors.tencent.com/pypi/simple/ \
            -r python/requirements.txt
          python -m pip install -i https://mirrors.tencent.com/pypi/simple/ \
            jsonschema pytest pytest-cov pytest-asyncio ruff mypy

      - name: Run pytest with coverage
        working-directory: python
        run: |
          python -m pytest -ra \
            --cov=app --cov-report=term-missing --cov-report=xml \
            tests/

      - name: Coverage gate (>= 80%)
        working-directory: python
        run: |
          python -c "
          import sys, coverage
          cov = coverage.Coverage()
          cov.load()
          total = 0.0; covered = 0.0
          for fname in cov.get_data().measured_files():
              if not fname.startswith(\"$(pwd)\"): continue
              analysis = cov._analyze(fname)
              total += len(analysis.statements)
              covered += len([s for s in analysis.statements if s in analysis.executed])
          pct = (covered / total * 100.0) if total else 0.0
          print(f'Coverage: {pct:.1f}% ({covered}/{total})')
          if pct < 80.0:
              sys.exit(1)
          "

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: python/coverage.xml
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # 2. node — syntax-check every .js file (no npm install)
  # ------------------------------------------------------------------
  node:
    name: node --check (js syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: node --check on every .js file
        run: |
          set -e
          echo "## node --check results" >> $GITHUB_STEP_SUMMARY
          fail=0
          while IFS= read -r f; do
            if ! node --check "$f"; then
              echo "❌ $f: parse error"
              fail=1
            else
              echo "✓ $f"
            fi
          done < <(find . -type f -name '*.js' \
                    -not -path './node_modules/*' \
                    -not -path './build/*' \
                    -not -path './dist/*')
          if [ "$fail" -eq 1 ]; then
            echo "❌ one or more .js files failed to parse" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  # ------------------------------------------------------------------
  # 3. smoke — bash scripts/smoke.sh end-to-end
  # ------------------------------------------------------------------
  smoke:
    name: smoke (bash + pytest + node check + JSON)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run smoke.sh
        run: bash scripts/smoke.sh

  # ------------------------------------------------------------------
  # 4. lint — ruff + mypy on python/app
  # ------------------------------------------------------------------
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: |
          python -m pip install -i https://mirrors.tencent.com/pypi/simple/ \
            ruff mypy

      - name: ruff check python/
        working-directory: python
        run: ruff check .

      - name: mypy python/app/ --ignore-missing-imports
        working-directory: python
        run: |
          mypy app/ --ignore-missing-imports \
            --no-error-summary --no-incremental || true
          # Don't fail the build on mypy (best-effort), but emit a summary
          echo "::notice::mypy best-effort finished (non-blocking)"

  # ------------------------------------------------------------------
  # 5. summary — always reports what was tested
  # ------------------------------------------------------------------
  summary:
    name: ci summary
    runs-on: ubuntu-latest
    needs: [python, node, smoke, lint]
    if: always()
    steps:
      - name: Print job results
        run: |
          echo "## CI summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| python | ${{ needs.python.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| node | ${{ needs.node.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| smoke | ${{ needs.smoke.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.python.result }}" != "success" ] || \
             [ "${{ needs.node.result }}" != "success" ] || \
             [ "${{ needs.smoke.result }}" != "success" ]; then
            exit 1
          fi
