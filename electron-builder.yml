appId: io.github.kevrai.studio
productName: Kevrai Omni
copyright: Copyright © 2026 Kevrai Omni contributors. Licensed under Kevrai Omni Community License v2.1 (commercial use requires prior written authorization).
# artifactName 硬编码无空格品牌名，避免 GitHub 把空格转成点导致
# latest.yml 中的 URL 与实际资产名不匹配（electron-updater 会 404）。
# productName 仍为 "Kevrai Omni"，仅用于窗口标题/开始菜单等显示。
artifactName: Kevrai-Omni-${version}-${arch}.${ext}
files:
  - "electron/**/*"
  - "renderer/**/*"
  - "assets/**/*"
  - "package.json"

# ---------- Directories where the app writes engines/models/user data ----------
extraResources:
  - from: "catalog"
    to: "catalog"
    filter: ["**/*"]
  - from: "python"
    to: "python"
    filter: ["**/*.py", "**/*.toml", "**/*.txt"]

# ---------- Windows: installer (NSIS) + portable zip, both published ----------
# Per-target artifactName is NOT supported by electron-builder 25 (target item
# only accepts {target, arch}); the top-level artifactName template applies to
# both, producing Kevrai Omni-<version>-x64.exe and -x64.zip.
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  # The executable's icon and version resource are embedded by
  # scripts/build_windows.sh using go-winres.  Letting electron-builder do it
  # as well would require rcedit.exe under Wine, which is not available in
  # every build environment — and would also overwrite our metadata.
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true        # <-- required
  createStartMenuShortcut: true
  shortcutName: Kevrai Omni
  deleteAppDataOnUninstall: false
  # Follow the system language instead of forcing English.
  #
  # NSIS resolves the language at runtime: the installer carries every language
  # listed here plus an auto-detect stub, and picks the one matching the host's
  # locale, falling back to the first entry when there is no match.  That is why
  # the list is multi-entry rather than a single value — a one-element list would
  # leave non-English systems with no choice but that one language.
  #
  # zh_CN is listed first so Chinese (Simplified) systems land on it directly;
  # en_US is the fallback for everything unmatched.  macOS/Linux installer
  # languages are unaffected — this key only drives the Windows NSIS wizard.
  installerLanguages:
    - zh_CN
    - en_US
  # Multi-language installers require Unicode, otherwise NSIS cannot encode the
  # non-Latin strings and the wizard renders mojibake.
  unicode: true
  # explicit: we do NOT bundle any engine
  include: null

# ---------- Linux: portable AppImage + deb ----------
linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  icon: assets/icons/icon-1024.png
  desktop:
    entry:
      Name: Kevrai Omni
      Comment: Local AI workstation
      Categories: AudioVideo;Development;

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  icon: assets/icons/icon-1024.png

# ---------- Common: compression, asar, GitHub publish (generates latest.yml) ----------
# `publish` is configured so electron-builder emits update metadata
# (latest.yml / latest-linux.yml / latest-mac.yml) even with --publish never.
# Actual upload is done by scripts/release.sh (gh release create), which also
# uploads these metadata files so electron-updater can find them.
compression: normal
asar: true
icon: assets/icons/icon.ico

directories:
  output: build/output
  buildResources: build

publish:
  provider: github
  owner: Bullobis
  repo: kevrai-omni
  releaseType: release
  vPrefixedTagName: true
