appId: io.github.kevrai.studio
productName: Kevrai Omni
copyright: Copyright © 2026 Kevrai Omni contributors. Licensed under Kevrai Omni Community License v2.1 (commercial use requires prior written authorization).
artifactName: ${productName}-${version}-${arch}.${ext}
files:
  - "electron/**/*"
  - "renderer/**/*"
  - "assets/**/*"
  - "package.json"

# ---------- Directories where the app writes engines/models/user data ----------
extraResources:
  - from: "catalog"
    to: "catalog"
    filter: ["**/*"]
  - from: "python"
    to: "python"
    filter: ["**/*.py", "**/*.toml", "**/*.txt"]

# ---------- Windows: installer (NSIS) + portable zip, both published ----------
win:
  target:
    - target: nsis
      arch: [x64]
      artifactName: ${productName}-Setup-${version}.${ext}
    - target: zip
      arch: [x64]
      artifactName: ${productName}-${version}-win-${arch}.${ext}
  signtoolOptions:
    sign: null

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true        # <-- required
  createStartMenuShortcut: true
  shortcutName: Kevrai Omni
  deleteAppDataOnUninstall: false
  installerLanguages: ["en_US"]
  # explicit: we do NOT bundle any engine
  include: null

# ---------- Linux: portable AppImage + deb ----------
linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  icon: assets/icons/icon-1024.png
  desktop:
    entry:
      Name: Kevrai Omni
      Comment: Local AI workstation
      Categories: AudioVideo;Development;

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  icon: assets/icons/icon-1024.png

# ---------- Common: compression, asar, GitHub publish (generates latest.yml) ----------
# `publish` is configured so electron-builder emits update metadata
# (latest.yml / latest-linux.yml / latest-mac.yml) even with --publish never.
# Actual upload is done by scripts/release.sh (gh release create), which also
# uploads these metadata files so electron-updater can find them.
compression: normal
asar: true
icon: assets/icons/icon.ico

directories:
  output: build/output
  buildResources: build

publish:
  provider: github
  owner: Bullobis
  repo: kevrai-omni
  releaseType: release
  vPrefixedTagName: true
