<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src 'self' http://127.0.0.1:17890 ws://127.0.0.1:17890; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Kevrai Omni — 环境准备</title>
  <style>
    :root { color-scheme: dark light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      background: linear-gradient(160deg, #0b1020 0%, #101a33 60%, #0d1526 100%);
      color: #e8ecf5;
    }
    .card {
      width: min(680px, 92vw); background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.09); border-radius: 16px;
      padding: 36px 40px; box-shadow: 0 18px 60px rgba(0,0,0,.45);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .brand img { width: 40px; height: 40px; border-radius: 10px; }
    h1 { font-size: 20px; margin: 0; font-weight: 650; }
    .sub { color: #9aa7c0; font-size: 13px; margin: 0 0 22px; }
    .status { font-size: 14px; line-height: 1.9; margin-bottom: 20px; }
    .status b { color: #fff; }
    .ok { color: #4ade80; } .warn { color: #fbbf24; } .err { color: #f87171; }
    .btn {
      appearance: none; border: 0; border-radius: 10px; padding: 12px 22px;
      font-size: 15px; font-weight: 600; cursor: pointer; margin-right: 10px; margin-bottom: 10px;
      background: linear-gradient(135deg, #4f7cff, #7a5cff); color: #fff;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn.ghost { background: rgba(255,255,255,.08); color: #cdd6ea; }
    .bar { height: 10px; border-radius: 6px; background: rgba(255,255,255,.08); overflow: hidden; margin: 16px 0 8px; }
    .bar > div { height: 100%; width: 0%; background: linear-gradient(90deg, #4f7cff, #9f7cff); transition: width .25s; }
    .stage { font-size: 13px; color: #9aa7c0; min-height: 20px; }
    .log {
      margin-top: 14px; font-size: 12px; color: #7f8ba3; background: rgba(0,0,0,.25);
      border-radius: 8px; padding: 10px 12px; max-height: 130px; overflow: auto;
      font-family: Consolas, monospace; white-space: pre-wrap; word-break: break-all;
    }
    .tip { margin-top: 18px; font-size: 12.5px; color: #8b98b3; line-height: 1.8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="../assets/icons/icon-256.png" alt="Kevrai Omni" />
      <div>
        <h1>欢迎使用 Kevrai Omni</h1>
        <p class="sub">首次启动 · 准备运行环境（一次性，约 1-5 分钟）</p>
      </div>
    </div>

    <div class="status" id="bs-status">正在检测 Python 运行环境…</div>

    <div class="bar" id="bs-bar" hidden><div id="bs-bar-fill"></div></div>
    <div class="stage" id="bs-stage"></div>

    <div id="bs-actions">
      <button class="btn" id="btn-install" hidden>一键安装 Python 环境</button>
      <button class="btn" id="btn-deps" hidden>安装运行依赖</button>
      <button class="btn ghost" id="btn-retry">重试启动</button>
    </div>

    <div class="log" id="bs-log" hidden></div>

    <p class="tip" id="bs-tip">
      Kevrai Omni 的推理后端需要 Python 3.10+。为了保持安装包小巧，
      Python 与推理引擎一样按需下载：点上方按钮即可在软件内自动完成，全程无需命令行。
      下载源为国内镜像，安装位置在用户数据目录，不污染系统。
    </p>
  </div>
  <script src="bootstrap.js"></script>
</body>
</html>
